@if (isLoading$ | async) {
    <div class="lars-list-loader">
        <mat-spinner [diameter]="20"></mat-spinner>
    </div>
} @else {
    @if (list$ | async; as list) {
        <ag-grid-angular
            class="lars-logs-grid"
            [theme]="gridOptions.theme"
            [rowData]="list"
            [columnDefs]="colDefs">
        </ag-grid-angular>
    }
}
