<ng-container *transloco="let i18n">
    <h2 mat-dialog-title>{{ i18n('profile.ProfileSettings.TokenDialog.Warning') }}</h2>
    <mat-dialog-content>
        <span [innerHTML]="i18n('profile.ProfileSettings.TokenDialog.Message')"></span>
        <p>{{ i18n('profile.ProfileSettings.TokenDialog.Assurance') }}</p>
    </mat-dialog-content>
    <mat-dialog-actions>
        <button
            mat-flat-button
            cdkFocusInitial
            (click)="abort()">{{ i18n('profile.ProfileSettings.TokenDialog.Cancel') }}</button>
        <button
            mat-button
            (click)="confirm()">{{ i18n('profile.ProfileSettings.TokenDialog.Apply') }}</button>
      </mat-dialog-actions>
</ng-container>
